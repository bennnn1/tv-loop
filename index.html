<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

.slide{
    position:absolute;
    inset:0;
    display:none;
}

.active{
    display:block;
}

.slide img.bg{
    width:100%;
    height:100%;
    object-fit:contain;
}

.dateRange{
    position:absolute;

    left:40px;
    top:110px;

    width:260px;

    text-align:center;

    font-family:Calibri;
    font-size:28px;
    font-weight:bold;

    color:white;
}

</style>

</head>

<body>

<div id="slide1" class="slide active">
    <img class="bg" src="Current Week.png">
    <div id="week1Date" class="dateRange"></div>
</div>

<div id="slide2" class="slide">
    <img class="bg" src="Next Week.png">
    <div id="week2Date" class="dateRange"></div>
</div>

<div id="slide3" class="slide">
    <img class="bg" src="note.png">
</div>

<script>

const slides=[
    document.getElementById("slide1"),
    document.getElementById("slide2"),
    document.getElementById("slide3")
];

const durations=[
    42000,
    15000,
    4000
];

let current=0;

function runLoop(){

    setTimeout(()=>{

        slides[current].classList.remove("active");

        current++;

        if(current>=slides.length)
            current=0;

        slides[current].classList.add("active");

        runLoop();

    },durations[current]);

}

runLoop();

</script>

</body>
</html>
