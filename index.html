<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Slideshow with Countdown</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Slide wrapper to hold images and overlays together */
        .slide-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out; /* Smooth crossfade */
        }

        .slide-wrapper.active {
            opacity: 1;
        }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
        }

        /* Floating Animated GIF Positioned Perfectly on Slide 3 */
        .animated-overlay {
            position: absolute;
            top: 18.5%;  
            left: 5.8%;  
            width: 10.6%; 
            height: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* The Countdown Bar Container */
        .timer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        /* The Moving Bar itself */
        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #00bcd4; /* Bright cyan color */
            transform-origin: left center;
            transform: scaleX(1);
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <div id="timerBar" class="timer-bar"></div>
    </div>

    <div class="slideshow-container">
        
        <div class="slide-wrapper active">
            <img src="Slide1.PNG" class="slide-img">
        </div>
        
        <div class="slide-wrapper">
            <img src="Slide2.PNG" class="slide-img">
        </div>
        
        <div class="slide-wrapper">
            <img src="Slide3.PNG" class="slide-img">
            <img src="army.gif" class="animated-overlay">
        </div>

    </div>

    <script>
        const wrappers = document.querySelectorAll('.slide-wrapper');
        const timerBar = document.getElementById('timerBar');
        let currentSlide = 0;
        let timerTimeout;

        // Custom display times for each slide (in milliseconds)
        const slideTimes = [
            42000, // Slide 1: 42 seconds
            7000,  // Slide 2: 7 seconds
            15000  // Slide 3: 15 seconds
        ];

        function startSlideCycle() {
            // Reset the progress bar animation completely
            timerBar.style.transition = 'none';
            timerBar.style.transform = 'scaleX(1)';
            
            // Force browser to recognize the reset
            void timerBar.offsetWidth; 

            // Tell the bar to shrink smoothly to 0 over the exact slide duration
            const currentDuration = slideTimes[currentSlide];
            timerBar.style.transition = `transform ${currentDuration}ms linear`;
            timerBar.style.transform = 'scaleX(0)';

            // Set a timeout to switch to the next slide when the bar hits 0
            timerTimeout = setTimeout(nextSlide, currentDuration);
        }

        function nextSlide() {
            // Hide current slide
            wrappers[currentSlide].classList.remove('active');
            
            // Move to next slide index
            currentSlide = (currentSlide + 1) % wrappers.length;
            
            // Show next slide
            wrappers[currentSlide].classList.add('active');

            // Restart the countdown bar for the new slide
            startSlideCycle();
        }
