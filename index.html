<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dining Menu Display</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<div id="slide1" class="slide active">
    <img src="Current Week.png" class="bg">

    <div id="date1" class="dateRange"></div>

    <div id="menu1" class="menuLayer"></div>
</div>

<div id="slide2" class="slide">
    <img src="Next Week.png" class="bg">

    <div id="date2" class="dateRange"></div>

    <div id="menu2" class="menuLayer"></div>
</div>

<div id="slide3" class="slide">
    <img src="note.png" class="bg">
</div>

<script src="app.js"></script>

</body>
</html>
