<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Menu Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: none; /* Hidden by default */
      /* Forces modern browsers to render crisp edges without blurring */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    img.active {
      display: block; /* Show active image */
    }
  </style>
  <!-- Page hard-refreshes every 2 hours to pull down new images if updated -->
  <meta http-equiv="refresh" content="7200">
</head>
<body>

  <!-- Slide Images (Names must match capitalization exactly) -->
  <img id="slide1" class="active" src="CurrentWeek.png" alt="Current Week Menu">
  <img id="slide2" src="NextWeek.png" alt="Next Week Menu">
  <img id="slide3" src="Note.jpg" alt="Dining Note">

  <script>
    // Slides configuration: element ID and display time in milliseconds
    const playlist = [
      { id: "slide1", duration: 45000 }, // 45 seconds
      { id: "slide2", duration: 15000 }, // 15 seconds
      { id: "slide3", duration: 15000 }  // 15 seconds
    ];

    let currentIndex = 0;

    function showNextSlide() {
      // Hide current slide
      const currentSlide = document.getElementById(playlist[currentIndex].id);
      currentSlide.classList.remove("active");

      // Advance to next index (loop back to 0 at the end)
      currentIndex = (currentIndex + 1) % playlist.length;

      // Show next slide
      const nextSlide = document.getElementById(playlist[currentIndex].id);
      nextSlide.classList.add("active");

      // Schedule the next transition based on the current slide's custom duration
      setTimeout(showNextSlide, playlist[currentIndex].duration);
    }

    // Start rotation loop after the first slide finishes its 45-second timer
    setTimeout(showNextSlide, playlist[0].duration);
  </script>

</body>
</html>
