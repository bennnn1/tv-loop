<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Menu Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      cursor: none; /* Forces the browser to hide the mouse pointer */
    }
    img {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain;
      display: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    img.active { display: block; }
  </style>
  <meta http-equiv="refresh" content="7200">
</head>
<body>

  <img id="slide1" class="active" alt="Current Week Menu">
  <img id="slide2" alt="Next Week Menu">
  <img id="slide3" src="Note.png" alt="Dining Note">

  <script>
    // Anchor Date: November 1, 2026 is known to be Week 3
    const anchorDate = new Date(2026, 10, 1).getTime(); // Month 10 is November
    const anchorWeekIndex = 3;

    // Calculate how many weeks have passed since the anchor date
    const now = new Date().getTime();
    const diffTime = now - anchorDate;
    const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));

    // Determine current and next menu indexes (1 through 4)
    let currentMenuIndex = ((anchorWeekIndex - 1 + diffWeeks) % 4 + 4) % 4 + 1;
    let nextMenuIndex = (currentMenuIndex % 4) + 1;

    // Assign filenames (using lowercase .png)
    document.getElementById("slide1").src = `Week${currentMenuIndex}.png`;
    document.getElementById("slide2").src = `Week${nextMenuIndex}.png`;

    // Playlist rotation timers (Current: 45s, Next: 15s, Note: 15s)
    const playlist = [
      { id: "slide1", duration: 45000 },
      { id: "slide2", duration: 15000 },
      { id: "slide3", duration: 15000 }
    ];

    let currentIndex = 0;
    function showNextSlide() {
      document.getElementById(playlist[currentIndex].id).classList.remove("active");
      currentIndex = (currentIndex + 1) % playlist.length;
      document.getElementById(playlist[currentIndex].id).classList.add("active");
      setTimeout(showNextSlide, playlist[currentIndex].duration);
    }

    setTimeout(showNextSlide, playlist[0].duration);
  </script>

</body>
</html>
